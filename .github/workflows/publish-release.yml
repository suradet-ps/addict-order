name: "Publish Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.1.0-test.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependency advisories
        # cargo-deny covers advisories on every PR; this is the loud,
        # dedicated audit on the release path.
        run: cargo audit

  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Build
          - platform: "windows-latest"
            args: ""
            trunk-artifact: "trunk-x86_64-pc-windows-msvc.zip"
          # Linux Build (Ubuntu 24.04)
          - platform: "ubuntu-24.04"
            args: ""
            trunk-artifact: "trunk-x86_64-unknown-linux-gnu.tar.gz"
          # macOS Build (Apple Silicon)
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            trunk-artifact: "trunk-aarch64-apple-darwin.tar.gz"
          # Uncomment if Intel Mac support is ever needed
          # - platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin"
          #   trunk-artifact: "trunk-x86_64-apple-darwin.tar.gz"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust stable (wasm target)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf

      - name: Install Trunk
        shell: bash
        run: |
          # GitHub release downloads occasionally drop the connection;
          # retry before giving up. Windows ships trunk as a .zip
          # (trunk.exe at the archive root); every other target is .tar.gz.
          # Expand-Archive keys off the file extension, so use a .zip name
          # on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then
            CURL=curl.exe; ARCHIVE=trunk.zip
          else
            CURL=curl; ARCHIVE=trunk.tar.gz
          fi
          for attempt in 1 2 3 4; do
            $CURL -LsSf https://github.com/trunk-rs/trunk/releases/download/v0.21.14/${{ matrix.trunk-artifact }} -o "$ARCHIVE" \
              && mkdir -p "$HOME/.cargo/bin" \
              && if [ "$RUNNER_OS" = "Windows" ]; then
                   powershell -Command "Expand-Archive -Force -Path trunk.zip -DestinationPath trunk-extract"
                   cp trunk-extract/trunk.exe "$HOME/.cargo/bin/"
                 else
                   tar -xzf "$ARCHIVE" -C "$HOME/.cargo/bin"
                 fi \
              && break
            echo "trunk download failed (attempt $attempt/4) - retrying in 10s"
            sleep 10
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -x "$HOME/.cargo/bin/trunk.exe"
          else
            test -x "$HOME/.cargo/bin/trunk"
          fi

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Addict Order ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
