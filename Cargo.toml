[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/core",
    "crates/hosxp-connector",
    "src-tauri",
]
# The GUI shell is excluded from default commands so `cargo test` at the root
# stays fast and database-free. Check it explicitly with `-p addict-order-tauri`.
default-members = [
    "crates/models",
    "crates/core",
    "crates/hosxp-connector",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
encryptman = "0.5.0"
encryptman-keyring = "0.1.3"
md-5 = "0.10"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "tls-rustls-ring-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
tempfile = "3"
