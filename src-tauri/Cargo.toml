[package]
name = "addict-order-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri 2 shell for Addict Order - thin command adapters, no SQL"

[lib]
name = "addict_order_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
addict-order-core = { path = "../crates/core" }
addict-order-hosxp-connector = { path = "../crates/hosxp-connector" }
addict-order-models = { path = "../crates/models" }
chrono.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
